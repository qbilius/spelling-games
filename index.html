<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spelling Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600&display=swap">
<style>
:root{color-scheme:light;--bg:#fff8e6;--card:#fff;--ink:#2b2a3a;--muted:#7a7790;--line:#efe6cc;--sky:#3b82f6;
  --display:'Fredoka',system-ui,sans-serif;--body:'Nunito',system-ui,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font:600 17px/1.45 var(--body);padding-inline:16px;padding-block:32px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font:700 2.4rem/1.1 var(--display);margin:0}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.game{display:flex;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:20px;
  padding:16px;color:inherit;text-decoration:none;box-shadow:0 5px 0 var(--line)}
.game:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.game:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.emoji{font-size:2.6rem;line-height:1;flex:none}
.text{min-width:0}
.text b{font:700 1.3rem var(--display);display:block}
.text p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
</style>
</head>
<body>
<main>
  <h1>Spelling Games</h1>
  <div class="list">
<!-- GAMES -->
  </div>
</main>
</body>
</html>
